spring.application.name=BridgeProtocolLab

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:bridge_protocol_lab}
spring.datasource.username=${POSTGRES_USER:bridge_lab}
spring.datasource.password=${POSTGRES_PASSWORD:bridge_lab_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.liquibase.change-log=classpath:db/changelog/master.yaml

server.port=${APP_PORT:8080}
server.servlet.context-path=/api
