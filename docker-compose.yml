name: bridge-protocol-lab

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bridge_protocol_lab}
      POSTGRES_USER: ${POSTGRES_USER:-bridge_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bridge_lab_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-bridge_protocol_lab}
      POSTGRES_USER: ${POSTGRES_USER:-bridge_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bridge_lab_password}

volumes:
  pgdata:
